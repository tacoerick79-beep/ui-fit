<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio — Cyber Y2K</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c6ff3d}a:hover{color:#ffffff}
.grid-bg{background-color:#08080d;background-image:linear-gradient(rgba(198,255,61,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(198,255,61,.06) 1px, transparent 1px);background-size:26px 26px}
.chrome-text{background:linear-gradient(180deg,#ffffff 0%,#b9b9c9 45%,#5d5d6e 52%,#e9e9f2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.holo{background:linear-gradient(120deg,#d8ffb0 0%,#c9d6ff 35%,#f4c9ff 60%,#fff2b3 100%)}
</style>
</helmet>
<div class="grid-bg" style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 14px; font-family: 'Space Grotesk', sans-serif; color: #f2f2f7; overflow: hidden; position: relative">

  <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" style="position: absolute; top: 70px; right: 40px"><path d="M12 0C12.6 7 17 11.4 24 12C17 12.6 12.6 17 12 24C11.4 17 7 12.6 0 12C7 11.4 11.4 7 12 0Z" fill="#c6ff3d"/></svg>
  <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" style="position: absolute; top: 46px; right: 82px"><path d="M12 0C12.6 7 17 11.4 24 12C17 12.6 12.6 17 12 24C11.4 17 7 12.6 0 12C7 11.4 11.4 7 12 0Z" fill="#ff7ad9"/></svg>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Michroma', sans-serif; font-size: 11px; letter-spacing: 3px; color: #9a9aae">MAR · 06 · OCT</span>
    <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg,#ffffff,#8a8a9c 50%,#e2e2ec); display: flex; align-items: center; justify-content: center; color: #08080d; font-family: 'Michroma', sans-serif; font-size: 13px">E</div>
  </div>
  <h1 class="chrome-text" style="margin: -6px 0 0; font-family: 'Michroma', sans-serif; font-size: 34px; line-height: 1.05; font-weight: 400">HOLA DE<br>NUEVO</h1>

  <section class="holo" style="border-radius: 28px; padding: 18px 18px 16px; color: #0c0c14; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 1px rgba(255,255,255,.5) inset, 0 10px 40px rgba(201,214,255,.18)">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 500">Saldo disponible</span>
        <span style="font-size: 44px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">$2,800<span style="font-size: 22px">.00</span></span>
      </div>
      <span style="padding: 6px 10px; border-radius: 99px; background: #0c0c14; color: #c6ff3d; font-size: 11px; font-weight: 700">+12% mes</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 48px; border-radius: 16px; border: 0; background: #0c0c14; color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 500">+ Ingreso</button>
      <button style="height: 48px; border-radius: 16px; border: 0; background: #0c0c14; color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 500">− Gasto</button>
      <button style="height: 48px; border-radius: 16px; border: 1.5px solid #0c0c14; background: transparent; color: #0c0c14; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700">Historial</button>
    </div>
  </section>

  <section style="border-radius: 24px; padding: 16px 18px; background: #14141d; border: 1px solid #2a2a38; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 700">Viaje a Japón</span>
      <span style="font-family: 'Michroma', sans-serif; font-size: 14px; color: #c6ff3d">64%</span>
    </div>
    <div style="height: 14px; border-radius: 99px; padding: 3px; background: linear-gradient(180deg,#3a3a48,#1b1b24); box-shadow: inset 0 1px 2px #000">
      <div style="width: 64%; height: 100%; border-radius: 99px; background: repeating-linear-gradient(90deg,#c6ff3d 0 10px,#9fdc1a 10px 12px); box-shadow: 0 0 12px rgba(198,255,61,.6)"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #a6a6b8">
      <span>$3,200 de $5,000</span>
      <span>15 · 06 · 2027</span>
    </div>
  </section>

  <section style="border-radius: 24px; padding: 16px 18px; background: #14141d; border: 1px solid #2a2a38; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 700">Racha</span>
      <span style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: rgba(255,122,217,.14); color: #ff9be3; font-size: 12px; font-weight: 700">
        <svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 0C12.6 7 17 11.4 24 12C17 12.6 12.6 17 12 24C11.4 17 7 12.6 0 12C7 11.4 11.4 7 12 0Z" fill="#ff9be3"/></svg>3 semanas
      </span>
    </div>
    <div style="display: flex; justify-content: space-between">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: 'Michroma', sans-serif; font-size: 10px; letter-spacing: 2px; color: #9a9aae">{{m.name}}</span>
          <div style="display: grid; grid-template-columns: repeat(7, 8px); gap: 5px">
            <sc-for list="{{m.days}}" as="d" hint-placeholder-count="31">
              <div style="width: 8px; height: 8px; border-radius: 50%; background: {{d.bg}}; box-shadow: {{d.sh}}"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="border-radius: 24px; padding: 12px 12px 12px 14px; background: #14141d; border: 1px solid #2a2a38; display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px solid #c6ff3d; display: flex; align-items: center; justify-content: center; font-family: 'Michroma', sans-serif; font-size: 16px; color: #c6ff3d">2</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">Back + Biceps + Legs</span>
      <span style="font-size: 12px; color: #a6a6b8">Hoy · 6 ejercicios</span>
    </div>
    <button aria-label="Empezar entrenamiento" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #c6ff3d; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#0c0c14"/></svg>
    </button>
  </section>

  <nav style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); height: 64px; box-sizing: border-box; padding: 8px; border-radius: 99px; background: linear-gradient(180deg,#f4f4fa,#9c9cae 48%,#6c6c7c 52%,#d8d8e4); box-shadow: 0 8px 24px rgba(0,0,0,.6); display: flex; gap: 6px">
    <a href="#" aria-label="Inicio" style="width: 48px; height: 48px; border-radius: 50%; background: #0c0c14; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c6ff3d" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>
    </a>
    <a href="#" aria-label="Calendario" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0c0c14" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </a>
    <a href="#" aria-label="Estadísticas" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0c0c14" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
    </a>
    <a href="#" aria-label="Ajustes" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0c0c14" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildMonths(c) {
    const names = ['AGO', 'SEP', 'OCT'];
    return [7, 8, 9].map((m, i) => {
      const off = (new Date(2026, m, 1).getDay() + 6) % 7;
      const n = new Date(2026, m + 1, 0).getDate();
      const days = [];
      for (let k = 0; k < off; k++) days.push(c.blank);
      for (let d = 1; d <= n; d++) {
        const dow = new Date(2026, m, d).getDay();
        let s = 'miss';
        if (m === 9 && d > 6) s = 'future';
        else if (m === 9 && d === 6) s = 'today';
        else if ([1, 2, 4, 5].indexOf(dow) >= 0 && (d * 3 + m) % 7 !== 0) s = 'done';
        days.push(c[s]);
      }
      return { name: names[i], days: days };
    });
  }
  renderVals() {
    return {
      months: this.buildMonths({
        blank: { bg: 'transparent', sh: 'none' },
        done: { bg: '#c6ff3d', sh: '0 0 6px rgba(198,255,61,.8)' },
        miss: { bg: '#3a3a4a', sh: 'none' },
        today: { bg: '#ff7ad9', sh: '0 0 8px rgba(255,122,217,.9)' },
        future: { bg: '#1f1f2a', sh: 'none' }
      })
    };
  }
}
</script>
</body>
</html>
