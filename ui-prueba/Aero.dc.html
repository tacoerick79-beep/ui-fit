<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio — Frutiger Aero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&amp;family=Nunito:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0a5fa8}a:hover{color:#063d6e}
.sky{background:radial-gradient(120% 60% at 50% 0%,#ffffff 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,#8fd8ff 0%,#c9f0ff 45%,#e9fbe6 80%,#bfeaa0 100%)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.62) 50%,rgba(255,255,255,.5) 51%,rgba(255,255,255,.72) 100%);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(20,90,150,.18),inset 0 1px 0 #ffffff}
.gel{background:linear-gradient(180deg,#7fd4ff 0%,#1e9bf0 50%,#0a7fd6 51%,#38b6ff 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 8px rgba(10,110,200,.35)}
.gel-green{background:linear-gradient(180deg,#b9f57a 0%,#5fcf1d 50%,#3fb50a 51%,#7fe03a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 8px rgba(60,150,20,.35)}
.bubble{background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.25) 30%,rgba(140,210,255,.18) 70%,rgba(255,255,255,.6) 100%);border:1px solid rgba(255,255,255,.7)}
</style>
</helmet>
<div class="sky" style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 14px; font-family: 'Nunito', sans-serif; color: #0b2a44; overflow: hidden; position: relative">

  <div class="bubble" aria-hidden="true" style="position: absolute; width: 90px; height: 90px; border-radius: 50%; top: 30px; right: -20px"></div>
  <div class="bubble" aria-hidden="true" style="position: absolute; width: 34px; height: 34px; border-radius: 50%; top: 112px; right: 70px"></div>
  <div class="bubble" aria-hidden="true" style="position: absolute; width: 60px; height: 60px; border-radius: 50%; bottom: 120px; left: -18px"></div>

  <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px">
    <span style="font-size: 13px; font-weight: 700; color: #1a5f96">Martes 6 de octubre</span>
    <span style="font-family: 'Varela Round', sans-serif; font-size: 30px; color: #06375e">¡Hola de nuevo!</span>
  </div>

  <section class="glass" style="border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 700; color: #1a5f96">Saldo disponible</span>
        <span style="font-family: 'Varela Round', sans-serif; font-size: 42px; line-height: 1.05; color: #06375e">$2,800.00</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; text-align: right; color: #24527a">
        <span>Ingresos <b style="color: #2f7d0a">+$3,500</b></span>
        <span>Gastos <b style="color: #b3261e">−$1,025</b></span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="gel-green" style="height: 46px; border-radius: 99px; border: 1px solid #3b9a0c; color: #0e3300; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800">+ Ingreso</button>
      <button class="gel" style="height: 46px; border-radius: 99px; border: 1px solid #0a6cb8; color: #ffffff; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; text-shadow: 0 1px 1px rgba(0,40,80,.5)">− Gasto</button>
      <button style="height: 46px; border-radius: 99px; border: 1px solid #9fd2f2; background: rgba(255,255,255,.75); color: #0a5fa8; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800">Historial</button>
    </div>
  </section>

  <section class="glass" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 800">Viaje a Japón</span>
      <span style="font-size: 14px; font-weight: 800; color: #0a5fa8">64%</span>
    </div>
    <div style="height: 18px; border-radius: 99px; padding: 2px; background: rgba(10,95,168,.12); border: 1px solid rgba(10,95,168,.25); box-sizing: border-box">
      <div class="gel" style="width: 64%; height: 100%; border-radius: 99px"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #24527a">
      <span>$3,200 de $5,000</span>
      <span>Hasta 15/06/2027</span>
    </div>
  </section>

  <section class="glass" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 800">Racha</span>
      <span class="gel-green" style="padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 800; color: #0e3300">3 semanas</span>
    </div>
    <div style="display: flex; justify-content: space-between">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 700; color: #1a5f96">{{m.name}}</span>
          <div style="display: grid; grid-template-columns: repeat(7, 10px); gap: 4px">
            <sc-for list="{{m.days}}" as="d" hint-placeholder-count="31">
              <div style="width: 10px; height: 10px; border-radius: 50%; background: {{d.bg}}; border: 1px solid {{d.bd}}; box-sizing: border-box"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section class="glass" style="border-radius: 22px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
    <div class="gel" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Varela Round', sans-serif; font-size: 20px; color: #ffffff; text-shadow: 0 1px 1px rgba(0,40,80,.5)">2</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 15px; font-weight: 800">Back + Biceps + Legs</span>
      <span style="font-size: 12px; color: #24527a">Hoy · 6 ejercicios</span>
    </div>
    <button class="gel-green" style="height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid #3b9a0c; color: #0e3300; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800">Empezar</button>
  </section>

  <nav class="glass" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 66px; box-sizing: border-box; padding: 8px 14px; border-radius: 26px; display: flex; justify-content: space-between; align-items: center">
    <a href="#" aria-label="Inicio" class="gel" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>
    </a>
    <a href="#" aria-label="Calendario" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a5fa8" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </a>
    <a href="#" aria-label="Estadísticas" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a5fa8" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
    </a>
    <a href="#" aria-label="Ajustes" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a5fa8" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildMonths(c) {
    const names = ['Ago', 'Sep', 'Oct'];
    return [7, 8, 9].map((m, i) => {
      const off = (new Date(2026, m, 1).getDay() + 6) % 7;
      const n = new Date(2026, m + 1, 0).getDate();
      const days = [];
      for (let k = 0; k < off; k++) days.push(c.blank);
      for (let d = 1; d <= n; d++) {
        const dow = new Date(2026, m, d).getDay();
        let s = 'miss';
        if (m === 9 && d > 6) s = 'future';
        else if (m === 9 && d === 6) s = 'today';
        else if ([1, 2, 4, 5].indexOf(dow) >= 0 && (d * 3 + m) % 7 !== 0) s = 'done';
        days.push(c[s]);
      }
      return { name: names[i], days: days };
    });
  }
  renderVals() {
    return {
      months: this.buildMonths({
        blank: { bg: 'transparent', bd: 'transparent' },
        done: { bg: 'radial-gradient(circle at 35% 30%, #d6f0ff 0 20%, #1e9bf0 60%, #0a6cb8 100%)', bd: '#0a6cb8' },
        miss: { bg: 'rgba(255,255,255,.7)', bd: '#a9d3ee' },
        today: { bg: 'radial-gradient(circle at 35% 30%, #f0ffd9 0 20%, #5fcf1d 60%, #2f8f05 100%)', bd: '#2f8f05' },
        future: { bg: 'transparent', bd: '#c3e2f5' }
      })
    };
  }
}
</script>
</body>
</html>
