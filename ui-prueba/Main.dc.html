<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio — Retro OS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=VT323&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22206b}a:hover{color:#000}
.desk{background-color:#9aa3f5;background-image:repeating-conic-gradient(#8e97ec 0 25%, transparent 0 50%);background-size:4px 4px}
</style>
</helmet>
<div class="desk" style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 14px 0; display: flex; flex-direction: column; gap: 12px; font-family: 'IBM Plex Mono', monospace; color: #15143a; overflow: hidden; position: relative">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 4px 2px 0">

      <span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #22206b">MAR 06 OCT</span>
      <span style="font-family: 'Silkscreen', monospace; font-size: 24px; font-weight: 700; color: #ffffff; text-shadow: 2px 2px 0 #22206b">Hola de nuevo</span>
    </div>
    <div style="width: 40px; height: 40px; box-sizing: border-box; background: #b6ff3b; border: 2px solid; border-color: #ffffff #22206b #22206b #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-size: 16px; font-weight: 700">E</div>
  </div>

  <section style="background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; box-shadow: 2px 2px 0 #22206b">
    <div style="height: 26px; padding: 0 4px 0 8px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, #22206b, #7b6cf6); color: #ffffff; font-family: 'Silkscreen', monospace; font-size: 12px">
      <span>saldo.exe</span>
      <span aria-hidden="true" style="display: flex; gap: 3px"><span style="width: 16px; height: 14px; background: #d6d2e8; border: 1px solid; border-color: #fff #2a2950 #2a2950 #fff; color: #15143a; font-size: 10px; line-height: 12px; text-align: center">_</span><span style="width: 16px; height: 14px; background: #d6d2e8; border: 1px solid; border-color: #fff #2a2950 #2a2950 #fff; color: #15143a; font-size: 10px; line-height: 12px; text-align: center">x</span></span>
    </div>
    <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 11px">Saldo disponible</span>
          <span style="font-family: 'VT323', monospace; font-size: 54px; line-height: 0.9; color: #15143a">$2,800.00</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; font-size: 11px; text-align: right">
          <span>Ingresos <b>+$3,500</b></span>
          <span>Gastos <b>−$1,025</b></span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <button style="height: 44px; background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #15143a">+ Ingreso</button>
        <button style="height: 44px; background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #15143a">− Gasto</button>
        <button style="height: 44px; background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #15143a">Historial</button>
      </div>
    </div>
  </section>

  <section style="background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; box-shadow: 2px 2px 0 #22206b">
    <div style="height: 26px; padding: 0 4px 0 8px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, #22206b, #7b6cf6); color: #ffffff; font-family: 'Silkscreen', monospace; font-size: 12px">
      <span>metas.exe</span>
      <a href="#" style="color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 11px">ver todas</a>
    </div>
    <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12px">
        <b>Viaje a Japón</b>
        <span>64%</span>
      </div>
      <div style="height: 22px; box-sizing: border-box; padding: 2px; background: #ffffff; border: 2px solid; border-color: #2a2950 #ffffff #ffffff #2a2950; display: flex; gap: 2px">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="20">
          <div style="flex: 1; background: {{s.bg}}"></div>
        </sc-for>
      </div>
      <span style="font-size: 11px">Copiando $3,200 de $5,000… faltan $1,800</span>
    </div>
  </section>

  <section style="background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; box-shadow: 2px 2px 0 #22206b">
    <div style="height: 26px; padding: 0 4px 0 8px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, #22206b, #7b6cf6); color: #ffffff; font-family: 'Silkscreen', monospace; font-size: 12px">
      <span>racha.exe</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">3 semanas seguidas</span>
    </div>
    <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-family: 'Silkscreen', monospace; font-size: 11px">{{m.name}}</span>
            <div style="display: grid; grid-template-columns: repeat(7, 10px); gap: 4px">
              <sc-for list="{{m.days}}" as="d" hint-placeholder-count="31">
                <div style="width: 10px; height: 10px; box-sizing: border-box; background: {{d.bg}}; border: 1px solid {{d.bd}}"></div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 12px; font-size: 10px">
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; background: #22206b"></span>entrené</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; background: #b6ff3b; border: 1px solid #22206b"></span>hoy</span>
      </div>
    </div>
  </section>

  <section style="background: #d6d2e8; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; box-shadow: 2px 2px 0 #22206b">
    <div style="height: 26px; padding: 0 4px 0 8px; display: flex; align-items: center; background: linear-gradient(90deg, #22206b, #7b6cf6); color: #ffffff; font-family: 'Silkscreen', monospace; font-size: 12px">
      <span>hoy.exe</span>
    </div>
    <div style="padding: 10px 12px 12px; display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; background: #22206b; color: #b6ff3b; display: flex; align-items: center; justify-content: center; font-family: 'VT323', monospace; font-size: 34px">2</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <b style="font-size: 14px">Back + Biceps + Legs</b>
        <span style="font-size: 11px">6 ejercicios · ~50 min</span>
      </div>
      <button style="height: 44px; padding: 0 12px; background: #b6ff3b; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff; font-family: 'Silkscreen', monospace; font-size: 12px; font-weight: 700; color: #15143a">Empezar</button>
    </div>
  </section>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; box-sizing: border-box; padding: 8px 10px 12px; background: #d6d2e8; border-top: 2px solid #ffffff; box-shadow: 0 -2px 0 #2a2950; display: flex; align-items: center; gap: 6px">
    <a href="#" style="height: 44px; padding: 0 12px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; background: #d6d2e8; border: 2px solid; border-color: #2a2950 #ffffff #ffffff #2a2950; text-decoration: none; color: #15143a; font-family: 'Silkscreen', monospace; font-size: 12px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22206b" stroke-width="2.5" stroke-linecap="square"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>Inicio
    </a>
    <a href="#" aria-label="Calendario" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22206b" stroke-width="2.5" stroke-linecap="square"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </a>
    <a href="#" aria-label="Estadísticas" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22206b" stroke-width="2.5" stroke-linecap="square"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
    </a>
    <a href="#" aria-label="Ajustes" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid; border-color: #ffffff #2a2950 #2a2950 #ffffff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22206b" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
    </a>
    <span style="margin-left: auto; height: 36px; padding: 0 10px; display: flex; align-items: center; border: 2px solid; border-color: #2a2950 #ffffff #ffffff #2a2950; font-family: 'VT323', monospace; font-size: 22px">07:42</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildMonths(c) {
    const names = ['Ago', 'Sep', 'Oct'];
    return [7, 8, 9].map((m, i) => {
      const off = (new Date(2026, m, 1).getDay() + 6) % 7;
      const n = new Date(2026, m + 1, 0).getDate();
      const days = [];
      for (let k = 0; k < off; k++) days.push(c.blank);
      for (let d = 1; d <= n; d++) {
        const dow = new Date(2026, m, d).getDay();
        let s = 'miss';
        if (m === 9 && d > 6) s = 'future';
        else if (m === 9 && d === 6) s = 'today';
        else if ([1, 2, 4, 5].indexOf(dow) >= 0 && (d * 3 + m) % 7 !== 0) s = 'done';
        days.push(c[s]);
      }
      return { name: names[i], days: days };
    });
  }
  renderVals() {
    const segs = [];
    for (let i = 0; i < 20; i++) segs.push({ bg: i < 13 ? '#22206b' : 'transparent' });
    return {
      segs: segs,
      months: this.buildMonths({
        blank: { bg: 'transparent', bd: 'transparent' },
        done: { bg: '#22206b', bd: '#22206b' },
        miss: { bg: '#ffffff', bd: '#a9a4c8' },
        today: { bg: '#b6ff3b', bd: '#22206b' },
        future: { bg: 'transparent', bd: '#a9a4c8' }
      })
    };
  }
}
</script>
</body>
</html>
