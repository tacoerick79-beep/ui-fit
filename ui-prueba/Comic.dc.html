<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio — Póster Cómic</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 12px 0; display: flex; flex-direction: column; gap: 10px; background: {{t.bg}}; font-family: 'Space Mono', monospace; color: {{t.ink}}; overflow: hidden; position: relative">

  <header style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px; color: {{t.head}}">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 1px">
      <span>MAR 06 OCT</span>
      <span style="padding: 2px 8px; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 700">DÍA 02</span>
    </div>
    <h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 64px; line-height: 0.95; letter-spacing: -0.5px; text-transform: uppercase">Sigue<span style="color: {{t.accent}}">.</span> Erick</h1>
  </header>

  <section style="padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; background-color: {{t.paper}}; background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1.2px); background-size: 5px 5px">
    <div aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 110px; height: 70px; opacity: 0.18; background-image: radial-gradient({{t.ink}} 1.3px, transparent 1.6px); background-size: 7px 7px"></div>
    <span style="align-self: flex-start; padding: 3px 8px; background: {{t.ink}}; color: {{t.paper}}; font-size: 10px; font-weight: 700; letter-spacing: 1px">SALDO DISPONIBLE</span>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <span style="font-family: 'Anton', sans-serif; font-size: 58px; line-height: 0.9">$2,800<span style="font-size: 28px">.00</span></span>
      <div style="display: flex; flex-direction: column; gap: 2px; font-size: 11px; text-align: right">
        <span>ING <b>+3,500</b></span>
        <span>GAS <b>−1,025</b></span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button style="height: 44px; border: 0; background: {{t.ink}}; color: {{t.paper}}; font-family: 'Anton', sans-serif; font-size: 16px; letter-spacing: 0.5px">+ INGRESO</button>
      <button style="height: 44px; border: 0; background: {{t.ink}}; color: {{t.paper}}; font-family: 'Anton', sans-serif; font-size: 16px; letter-spacing: 0.5px">− GASTO</button>
      <button style="height: 44px; border: 2px solid {{t.ink}}; background: transparent; color: {{t.ink}}; font-family: 'Anton', sans-serif; font-size: 16px; letter-spacing: 0.5px">HISTORIAL</button>
    </div>
  </section>

  <section style="padding: 12px 14px; border: 2px solid {{t.outline}}; color: {{t.head}}; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.5px">VIAJE A JAPÓN</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 22px; color: {{t.accentText}}">64%</span>
    </div>
    <div style="height: 18px; display: flex; gap: 3px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="20">
        <div style="flex: 1; background: {{s.bg}}; border: 1px solid {{s.bd}}"></div>
      </sc-for>
    </div>
    <span style="font-size: 11px">CARGANDO $3,200 / $5,000 — FALTAN $1,800</span>
  </section>

  <section style="display: flex; flex-direction: column; background-color: {{t.paper}}; background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1.2px); background-size: 5px 5px">
    <div style="padding: 6px 14px; background: {{t.ink}}; color: {{t.paper}}; display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 0.5px">RACHA</span>
      <span style="font-size: 11px; font-weight: 700"><span style="color: {{t.stripAccent}}">3 SEMANAS</span> SIN FALLAR</span>
    </div>
    <div style="padding: 12px 14px; display: flex; justify-content: space-between">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: 'Anton', sans-serif; font-size: 14px">{{m.name}}</span>
          <div style="display: grid; grid-template-columns: repeat(7, 10px); gap: 4px">
            <sc-for list="{{m.days}}" as="d" hint-placeholder-count="31">
              <div style="width: 10px; height: 10px; box-sizing: border-box; background: {{d.bg}}; border: 1px solid {{d.bd}}"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding: 10px 10px 10px 14px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; gap: 12px">
    <span style="font-family: 'Anton', sans-serif; font-size: 48px; line-height: 1">02</span>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1px">HOY TOCA</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 20px; line-height: 1.1">BACK + BICEPS + LEGS</span>
    </div>
    <button style="height: 48px; padding: 0 14px; border: 0; background: {{t.ink}}; color: {{t.paper}}; font-family: 'Anton', sans-serif; font-size: 16px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px">VAMOS
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.paper}}" stroke-width="3" stroke-linecap="square"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; padding: 10px 12px 14px; background: {{t.bg}}; border-top: 2px solid {{t.outline}}; display: flex; justify-content: space-between; align-items: center">
    <a href="#" aria-label="Inicio" style="width: 72px; height: 48px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.onAccent}}" stroke-width="2.5" stroke-linecap="square"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>
    </a>
    <a href="#" aria-label="Calendario" style="width: 72px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.head}}" stroke-width="2.5" stroke-linecap="square"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </a>
    <a href="#" aria-label="Estadísticas" style="width: 72px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.head}}" stroke-width="2.5" stroke-linecap="square"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
    </a>
    <a href="#" aria-label="Ajustes" style="width: 72px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.head}}" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["ciruela","noche","papel"],"default":"ciruela"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      ciruela: { bg: '#2B124C', head: '#FBE4D8', paper: '#FBE4D8', ink: '#190019', outline: '#DFB6B2', accent: '#DFB6B2', accentText: '#DFB6B2', stripAccent: '#DFB6B2', onAccent: '#190019', muted: '#C9A9A6', future: '#EAD3CB', segEmpty: '#854F6C' },
      noche: { bg: '#1E3163', head: '#F3E6C4', paper: '#F3E6C4', ink: '#13203F', outline: '#F3E6C4', accent: '#F2C14E', accentText: '#F2C14E', stripAccent: '#F2C14E', onAccent: '#13203F', muted: '#BFB08A', future: '#DCCFAB', segEmpty: '#4A5C8C' },
      papel: { bg: '#E9DFCB', head: '#1C1C1C', paper: '#FAF6EC', ink: '#1C1C1C', outline: '#1C1C1C', accent: '#D7372A', accentText: '#C42E22', stripAccent: '#FF8A7F', onAccent: '#FFFFFF', muted: '#C8BFAE', future: '#E3DCCD', segEmpty: '#B3A890' }
    };
  }
  buildMonths(c) {
    const names = ['AGO', 'SEP', 'OCT'];
    return [7, 8, 9].map((m, i) => {
      const off = (new Date(2026, m, 1).getDay() + 6) % 7;
      const n = new Date(2026, m + 1, 0).getDate();
      const days = [];
      for (let k = 0; k < off; k++) days.push(c.blank);
      for (let d = 1; d <= n; d++) {
        const dow = new Date(2026, m, d).getDay();
        let s = 'miss';
        if (m === 9 && d > 6) s = 'future';
        else if (m === 9 && d === 6) s = 'today';
        else if ([1, 2, 4, 5].indexOf(dow) >= 0 && (d * 3 + m) % 7 !== 0) s = 'done';
        days.push(c[s]);
      }
      return { name: names[i], days: days };
    });
  }
  renderVals() {
    const all = this.themes();
    const t = all[this.props.paleta] || all.ciruela;
    const segs = [];
    for (let i = 0; i < 20; i++) segs.push(i < 13 ? { bg: t.accent, bd: t.accent } : { bg: 'transparent', bd: t.segEmpty });
    return {
      t: t,
      segs: segs,
      months: this.buildMonths({
        blank: { bg: 'transparent', bd: 'transparent' },
        done: { bg: t.ink, bd: t.ink },
        miss: { bg: 'transparent', bd: t.muted },
        today: { bg: t.accent, bd: t.ink },
        future: { bg: 'transparent', bd: t.future }
      })
    };
  }
}
</script>
</body>
</html>
